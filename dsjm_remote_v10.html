<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1422"><title>DSJM Remote v1.0</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#0d1422;color:#edf3ff;margin:0;padding:16px}main{max-width:650px;margin:auto}h1{margin:6px 0;font-size:2rem}.tag,.sub{color:#afc0da;line-height:1.55}.tag{font-size:12px}.panel{background:#19243a;padding:18px;margin:16px 0;border-radius:16px;border:1px solid #324663}button,select{border:0;background:#3970e0;color:white;padding:15px 12px;border-radius:12px;font-weight:700;font-size:16px;min-height:48px}button:disabled{opacity:.38}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid button{width:100%}.stop{background:#ad475a}.active{background:#167a65;outline:2px solid #77ead0}.field{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}.field select{background:#354862;padding:10px;font-size:15px;min-width:100px}.field input{width:24px;height:24px}#log{white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow:auto;background:#0b1425;border-radius:10px;padding:12px;font-size:12px}#status{font-weight:700;font-size:20px}.ok{color:#75ead0}.warn,#error{color:#ffafb9}.note{color:#ffe6a6}.metric{border:1px solid #415571;border-radius:12px;padding:12px;line-height:1.6}button:focus-visible,select:focus-visible{outline:3px solid white}</style>
</head><body><main><div class="tag">BLUEFY · v1.0</div><h1>DSJM Remote</h1>
<section class="panel"><p id="status">연결되지 않음</p><div class="grid"><button id="connect">기기 연결</button><button id="disconnect" disabled>연결 해제</button></div><p class="sub">검색이 안 되면 Bluefy 앱에서 이 주소를 직접 여세요. 연결 대상은 DSJM만 선택하세요.</p><p id="error" role="alert"></p></section>
<section class="panel"><h2>진동 세기</h2><div class="grid" id="levels"></div><h2>진동 패턴</h2><div class="grid" id="patterns"></div><h2>정지</h2><button id="stop" class="stop control" disabled style="width:100%">■ 진동 정지</button><p id="current" class="sub">선택 없음</p></section>
<section class="panel"><h2>통신 로그</h2><pre id="log" aria-live="polite"></pre><button id="copy" style="background:#4c5a72">로그 복사</button></section>
<p class="sub">주의: 정지 후 120초마다 짧은 진동이 자동 발생할 수 있습니다. 기기를 착용하지 않고 시험하세요. Bluefy가 백그라운드로 이동하면 대기 유지가 중단됩니다.</p></main>
<script>
'use strict';
const S=0xFE00,T=0xFE01,R=0xFE02,INIT='0101010101010101010101010101010101010000',AUTH='0102535353535353535353535353535353530000';
const $=id=>document.getElementById(id);let device=null,tx=null,rx=null,ready=false,busy=false,connected=false,stopped=false,pulseRunning=false;let lines=[],timer=null,cycle=0,good=0,last='없음',lastResult='대기';let epoch=0;
const KEEP_PERIOD_MS=120000, PULSE_GAP_MS=20;
const byte=s=>new Uint8Array((s.match(/../g)||[]).map(x=>parseInt(x,16))), fmt=u=>Array.from(u).map(v=>v.toString(16).padStart(2,'0')).join(' ').toUpperCase();
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function log(t){lines.push(new Date().toLocaleTimeString()+' '+t);$('log').textContent=lines.slice(-180).join('\n');$('log').scrollTop=$('log').scrollHeight}
function display(t){$('status').textContent=t;$('connect').disabled=busy||connected;$('disconnect').disabled=!connected;document.querySelectorAll('.control').forEach(b=>b.disabled=!ready||busy||pulseRunning)}
function refresh(){/* 대기 유지 상태는 내부 로그로만 기록합니다. */}
function clearPulseTimer(){if(timer!==null){clearTimeout(timer);timer=null}refresh()}
function halt(reason){clearPulseTimer();if(reason)log('대기 자동전송 중단: '+reason)}
function reset(){++epoch;halt('BLE 연결 해제 또는 초기화');stopped=false;ready=false;connected=false;busy=false;device=null;tx=null;rx=null;document.querySelectorAll('.control').forEach(b=>b.classList.remove('active'));refresh();display('연결되지 않음')}
function onDisconnect(){log('BLE 연결 끊김');reset()}
function err(e){const m=typeof e==='object'&&e?[e.name,e.message].filter(Boolean).join(' / '):String(e);$('error').textContent='오류: '+m;log('오류: '+m)}
async function write(hex){let data=byte(hex);if(data.length!==20)throw Error('패킷 길이 오류 '+data.length);if(!tx)throw Error('FE01 미연결');if(tx.properties.write&&tx.writeValueWithResponse)await tx.writeValueWithResponse(data);else if(tx.properties.write&&tx.writeValue)await tx.writeValue(data);else if(tx.properties.writeWithoutResponse&&tx.writeValueWithoutResponse)await tx.writeValueWithoutResponse(data);else throw Error('Write API 없음');log('FE01 → '+fmt(data))}
const packet=n=>'0312'+n.toString(16).padStart(2,'0')+'00'.repeat(17);
function schedule(){clearPulseTimer();if(!ready||!connected||!stopped||document.hidden||busy||pulseRunning)return;const token=epoch;const ms=KEEP_PERIOD_MS;timer=setTimeout(()=>{timer=null;if(token===epoch)pulse()},ms);refresh()}
async function pulse(){if(pulseRunning||busy||!ready||!connected||!stopped||document.hidden||!device?.gatt?.connected)return;const token=epoch;pulseRunning=true;cycle++;lastResult='전송 중';log('대기유지 #'+cycle+' 시작');refresh();display('대기유지 전송 중');let onSent=false;try{await write(packet(1));onSent=true;await sleep(PULSE_GAP_MS);if(token!==epoch)throw Error('연결 상태 변경');await write(packet(0));good++;lastResult='ON/OFF 송신 성공';last=new Date().toLocaleTimeString();log('대기유지 #'+cycle+' ON → OFF 완료')}catch(e){lastResult='실패 - 자동 반복 중지';err(e);stopped=false;log('자동 반복 중지: 명령 전송 실패');if(onSent&&tx&&device?.gatt?.connected){try{await write(packet(0));log('실패 후 긴급 OFF 전송 성공')}catch(x){log('긴급 OFF 전송 실패: '+String(x))}}}finally{pulseRunning=false;refresh();display(ready?'제어 준비':'연결되지 않음');if(token===epoch)schedule()}}
function onNotify(e){const v=e.target.value;log('FE02 ← '+fmt(new Uint8Array(v.buffer,v.byteOffset,v.byteLength)))}
async function connect(){if(!navigator.bluetooth){err('navigator.bluetooth 없음. Bluefy 앱에서 주소를 직접 열어주세요');return}if(busy||connected)return;busy=true;display('기기 선택 중');$('error').textContent='';try{const opts={acceptAllDevices:true};log('기기 검색 '+JSON.stringify(opts));device=await navigator.bluetooth.requestDevice(opts);log('선택: '+device.name);if(device.name!=='DSJM'){log('DSJM 이외 장치 선택 - 종료');reset();return}device.addEventListener('gattserverdisconnected',onDisconnect);display('GATT 연결 중');const server=await device.gatt.connect();connected=true;log('GATT 연결 성공');display('FE00 접근 중');const service=await server.getPrimaryService(S);tx=await service.getCharacteristic(T);rx=await service.getCharacteristic(R);log('FE00 FE01 FE02 접근 성공');rx.addEventListener('characteristicvaluechanged',onNotify);await rx.startNotifications();log('FE02 Notify ON');display('초기화 중');await write(INIT);await sleep(400);display('인증 중');await write(AUTH);await sleep(500);ready=true;stopped=false;log('인증 패킷 전송 완료 (기기 응답 검증은 미구현)');display('제어 준비');refresh()}catch(e){err(e);if(device?.gatt?.connected)device.gatt.disconnect();reset()}finally{busy=false;display(ready?'제어 준비':connected?'연결됨':'연결되지 않음')}}
async function command(n,label,btn){if(!ready||busy||pulseRunning)return;busy=true;halt('사용자 제어');display('명령 전송 중');try{await write(packet(n));stopped=n===0;$('current').textContent=label;document.querySelectorAll('.control').forEach(b=>b.classList.remove('active'));btn.classList.add('active');log('사용자 선택: '+label+(n===0?' / 대기 유지 자동 시작 (120초 / 20ms)':''))}catch(e){err(e)}finally{busy=false;display(connected?'제어 준비':'연결되지 않음');refresh();schedule()}}
for(let n=1;n<=3;n++){const b=document.createElement('button');b.className='control';b.textContent='세기 '+n;b.disabled=true;b.onclick=()=>command(n,'세기 '+n,b);$('levels').append(b)}for(let n=1;n<=7;n++){const b=document.createElement('button');b.className='control';b.textContent='패턴 '+n;b.disabled=true;b.onclick=()=>command(n+3,'패턴 '+n,b);$('patterns').append(b)}
$('stop').onclick=()=>command(0,'진동 정지',$('stop'));
$('connect').onclick=()=>connect(false);
$('disconnect').onclick=async()=>{halt('수동 연결 해제');if(ready&&!busy&&!pulseRunning)await command(0,'진동 정지',$('stop'));if(device?.gatt?.connected)device.gatt.disconnect();else reset()};
document.addEventListener('visibilitychange',()=>{log('페이지 '+(document.hidden?'백그라운드':'전면'));if(document.hidden){halt('백그라운드에서는 반복 중단');if(pulseRunning)log('주의: 펄스 전송 도중 전환됨; OFF 전송 보장 불가')}else schedule()});
$('copy').onclick=()=>{navigator.clipboard?.writeText(lines.join('\n')).then(()=>log('로그 복사 완료')).catch(err)};
log('Bluefy='+/Bluefy/i.test(navigator.userAgent)+' | bluetooth API='+!!navigator.bluetooth+' | HTTPS='+window.isSecureContext);display('연결되지 않음');refresh();
</script></body></html>
