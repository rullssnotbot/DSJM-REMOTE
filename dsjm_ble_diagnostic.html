<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSJM BLE 검색 진단</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#101827;color:#e9eefb;padding:20px;line-height:1.5}button{display:block;width:100%;padding:15px;margin:12px 0;background:#386cdd;border:0;border-radius:12px;color:white;font-size:16px}pre{white-space:pre-wrap;word-break:break-all;background:#202b40;padding:12px;border-radius:10px;font-size:13px}small{color:#adbdd4}</style></head><body><h2>DSJM BLE 검색 진단</h2><p>이 페이지는 BLE 기기 선택창이 열리는지만 확인합니다. 모터 제어 명령을 보내지 않습니다.</p><button onclick="tryScan('none')">1. 필터 없이 검색 (옵션 최소)</button><button onclick="tryScan('name')">2. 이름 DSJM만 검색</button><button onclick="tryScan('service')">3. FE00 서비스로 검색</button><button onclick="tryScan('optional')">4. 기존 방식 (optionalServices 포함)</button><p><small>한 번에 하나씩 누르세요. 기기 선택창이 나타나면 DSJM을 선택할 수 있습니다. 연결은 진행하지 않습니다.</small></p><pre id="log"></pre><script>const log=document.getElementById('log');function say(s){log.textContent+=new Date().toLocaleTimeString()+' '+s+'\n'}say('Bluefy='+(/Bluefy/i.test(navigator.userAgent))+' | bluetooth API='+!!navigator.bluetooth+' | secure='+window.isSecureContext);async function tryScan(mode){let opts=mode==='none'?{acceptAllDevices:true}:mode==='name'?{filters:[{name:'DSJM'}]}:mode==='service'?{filters:[{services:[0xFE00]}]}:{acceptAllDevices:true,optionalServices:[0xFE00]};say('시작 '+mode+' '+JSON.stringify(opts));if(!navigator.bluetooth){say('navigator.bluetooth 없음');return}try{const d=await navigator.bluetooth.requestDevice(opts);say('선택 성공: '+(d.name||'(이름 없음)')+' / ID: '+d.id+' (GATT 연결은 하지 않음)')}catch(e){say('오류: type='+typeof e+' value='+String(e)+' name='+(e?.name||'')+' message='+(e?.message||''))}}</script></body></html>
